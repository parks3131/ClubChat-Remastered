# The gateway role. WebSockets over WSS, reached by the client at ws.<domain>.
#
# This is the only role whose restart is felt by every connected client at once, which is
# why it is a separate deployable from the api and can hold connections while the api rolls.

app = 'clubchat-gateway'
primary_region = 'iad'

[build]
  dockerfile = '../Dockerfile'

# No release_command here. Migrations run exactly once per release, from fly/api.toml.
[deploy]
  strategy = 'rolling'

[processes]
  app = 'node packages/server/src/gateway/main.ts'

[env]
  GATEWAY_PORT = '3001'
  LOG_LEVEL = 'info'

  # --- Error reporting ---
  #
  # Byte-identical to fly/api.toml, on purpose. `initMonitoring` tags every report with the role
  # that sent it, so ONE Sentry project separates the three rather than needing three DSNs - and
  # a per-app value that drifts is exactly how one role goes quiet without anybody noticing.
  # Same argument as the identity block below.
  #
  # `monitoring.ts` reports nothing anywhere unless SENTRY_DSN is set and non-empty;
  # SENTRY_ENVIRONMENT alone is a tag on reports that were never sent. fly/api.toml carries the
  # full reasoning, including why this is `[env]` rather than a `fly secrets` value.
  #
  # What is lost without it on THIS role: a socket frame that throws, a rejected session, and a
  # publish that fails become log lines inside a machine nobody is tailing - on the one process
  # whose failures are felt by every connected client at once.
  SENTRY_DSN = 'https://f4737021a3d55097c56ff4c479b9cdaa@o4511847446609920.ingest.us.sentry.io/4511847456964608'
  SENTRY_ENVIRONMENT = 'production'

  # How much traffic is timed. A tenth, matching the other two files, and for the reasons
  # fly/api.toml records at length: it is a cost decision, errors are unaffected by it, and it is
  # changed by editing the line and redeploying the same image rather than by shipping code.
  SENTRY_TRACES_SAMPLE_RATE = '0.1'

  # TRUST_PROXY is deliberately NOT set here, and this is not an oversight to be tidied up.
  # Nothing the gateway serves reads request.ip: no rate limiter, no auth by address, no
  # per-IP anything on /health or /ready. So a forged X-Forwarded-For has nothing to
  # influence, and the safe default costs nothing. Do not copy the api's value across.

  # --- The six secrets, and this app needs all six ---
  #
  # DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY and
  # MEDIA_SIGNING_SECRET are on the platform, not in this file, and **every one of them has to be
  # set on `clubchat-gateway` as well as on `clubchat-api`.** Same reason as the values below it:
  # one flat config schema, and every role calls `loadConfig` on the whole of it at startup. This
  # process refuses to boot without an S3 credential it never uses and a signing secret it never
  # reads.
  #
  # What that failure looks like here, which is the good case of the three: the machines fail
  # `/ready`, never take a socket, and stall the rolling deploy with a message. Compare
  # fly/worker.toml, where the same omission is silent.
  #
  #   printf 'DATABASE_URL=%s\nREDIS_URL=%s\nBETTER_AUTH_SECRET=%s\n' \
  #          "$DB_URL" "$REDIS_URL" "$AUTH_SECRET" \
  #     | fly secrets import --app clubchat-gateway
  #   printf 'S3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\n' "$S3_ID" "$S3_KEY" \
  #     | fly secrets import --app clubchat-gateway
  #   printf 'MEDIA_SIGNING_SECRET=%s\n' "$(openssl rand -hex 24)" \
  #     | fly secrets import --app clubchat-gateway
  #
  # `fly secrets import` and never `fly secrets set`: `set` takes the value as a command argument,
  # so it lands in shell history and in the process table. `import` reads NAME=VALUE from stdin.
  #
  # Two of them have rules, and they are opposite rules:
  #
  #   * **BETTER_AUTH_SECRET must be byte-identical to the api's.** This role reads it for real -
  #     `gateway/main.ts` passes it to `createAuth`, exactly as `api/main.ts` does. Hold a
  #     different value here and sign-in succeeds against the api while this socket rejects the
  #     session the api just issued. The member logs in and chat never connects, which presents
  #     as a broken client rather than as a wrong key.
  #   * **MEDIA_SIGNING_SECRET must NOT be the api's.** Nothing in this role reads it; it is
  #     required only because the schema is flat, so it needs a distinct throwaway that clears the
  #     16 character floor and nothing more. `fly secrets list` therefore shows a different digest
  #     here from the api's, and that is correct rather than drift. fly/api.toml carries the full
  #     reasoning and the Cloudflare Worker half of it.
  #
  # --- Identity and object storage ---
  #
  # Required by the schema and unread by this role, exactly like the media pair below. One flat
  # config serves all three roles, so the gateway refuses to boot without them even though it
  # serves no auth and never touches a bucket. `fly/api.toml` carries the full reasoning for
  # each value and this file deliberately does not restate it.
  #
  # Held byte-identical to the api's on purpose. The temptation on a role that reads none of
  # them is to leave a placeholder here, and the argument against it is the same one that makes
  # `TRUST_PROXY`'s absence above deliberate: a value that differs per app is how two halves of
  # one system come to disagree, and a placeholder is a value that differs.
  BETTER_AUTH_URL = 'https://api.clubchatapp.com'
  CLIENT_ORIGIN = 'https://clubchatapp.com'
  S3_ENDPOINT = 'https://47a52f98315af67a4231d979935ab1f2.r2.cloudflarestorage.com'
  S3_BUCKET_PUBLIC = 'clubchat-identity'
  S3_BUCKET_PRIVATE = 'clubchat-content'

  # --- Media ---
  #
  # The gateway serves no media at all. It never mints a download URL, never reads a bucket,
  # and `urlMode` is read in exactly one place in the codebase: the api's own media deps in
  # api/plumbing.ts. Both values below are unread by this process from the moment it boots.
  #
  # **They are here anyway because one flat config schema serves all three roles, and every
  # role parses the whole of it at startup.** config.ts validates eagerly on purpose, so a
  # missing required value is a startup failure with a readable message rather than an
  # undefined that surfaces on the first request that needs it. That is the right trade
  # everywhere else and it has this consequence here: delete either line and the gateway does
  # not boot, which during a rolling deploy means machines that never take a socket.
  #
  # So this is the opposite case to TRUST_PROXY above. There, a value the api needs is left off
  # because this role does not read it. Here, values this role does not read are present
  # because the schema requires them. Both are deliberate, and neither is a copy to tidy away.
  #
  # See fly/api.toml for what the two actually mean, why the first deploy ships 'presign', and
  # why MEDIA_SIGNING_SECRET is a `fly secrets set` rather than a line in one of these files.
  # It is required here too, for the same reason as these two, and is read by this role just as
  # little.
  MEDIA_URL_MODE = 'presign'
  MEDIA_CDN_BASE_URL = 'https://cdn.clubchatapp.com'

# An HTTP service, and this reverses what gateway/main.ts's opening comment implies.
#
# That comment says the gateway is deployed behind an L4 balancer rather than L7, because
# balancers that terminate HTTP break the WebSocket upgrade. That is true of L7 balancers in
# general and NOT true of Fly: a WebSocket upgrade is HTTP/1.1, and Fly's HTTP handler
# proxies it.
#
# The reason to use http_service rather than a raw tls-only service is decisive: a raw TCP
# service on Fly can only carry a tcp_check, which proves the port is listening and cannot
# tell that apart from working. That blind spot is the entire thing this deploy exists to
# close. http_service is what makes a real /ready check reachable.
[http_service]
  internal_port = 3001
  force_https = true
  processes = ['app']

  # A gateway that stops is every client reconnecting at once, and the event that produces
  # a great many reconnects simultaneously is a gateway restarting. Never auto-stop.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # A floor, not a count. See the same note in fly/api.toml: `fly deploy` creates two machines
  # for an app with a service unless passed `--ha=false`, and nothing in this file can express a
  # number. On this role two is worth having on purpose rather than by accident - a single
  # gateway machine means every client in the club reconnects at once every time it restarts.

# Set explicitly rather than inherited, because the default is not documented and community
# reports put it at 60 seconds, which is the kind of value that silently drops long-lived
# sockets and gets diagnosed as a client bug.
#
# In practice the heartbeat already keeps this moot: the server pings every 30s and the
# client pings on its own 30s cycle, so a healthy socket is never idle for 600s. This is
# belt and braces for the case where both ends are quiet.
[http_service.http_options]
  idle_timeout = 600

# Same reasoning as the api: /ready, never /health.
#
# Fly gates deploy success on this, so during a rolling deploy a gateway machine that cannot
# reach Postgres never takes sockets. Note what the shutdown path depends on: the gateway
# must call closeAllConnections() before server.close(), or this very check holds a
# keep-alive socket open, close() never resolves, SIGTERM never reaches the pool, and Fly
# SIGKILLs the machine mid-deploy.
[[http_service.checks]]
  method = 'GET'
  path = '/ready'
  interval = '15s'
  timeout = '5s'
  grace_period = '15s'

# The guest, pinned rather than defaulted.
#
# A machine with no [[vm]] block takes Fly's default guest, shared-cpu-1x at 256 MB, which is
# what this app took until 2026-08-23. 512 MB for the same reason the worker takes it: this is
# the role that holds every client's socket open simultaneously, so per-connection state plus
# Node's own footprint is not a thing to leave at a platform default and discover during the
# reconnect storm that a restart produces.
#
# It does NOT need the api's 1 GB, and the difference is not a guess. sharp is reached from the
# api's media routes and from the worker's derive step, and from nowhere in this role: the only
# static `import sharp` in the tree is in `media/pipeline.ts`, which this process never loads.
# See fly/api.toml's [[vm]] block for why that one import decides the api's number.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']
