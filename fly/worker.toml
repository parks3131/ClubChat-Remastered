# The worker role. No ingress at all: nothing reaches it, and it reaches out.
#
# It polls the outbox every 250ms and runs the effects. SPEC/TECH/04 requires every effect
# to be idempotent, and TECH/21 rule 11 records why that matters here specifically: a
# rolling deploy sends SIGTERM part-way through a drain, which is the commonest cause of an
# outbox event being handled twice. A deploy is the routine event that tests that
# requirement, so an effect idempotent only in theory fails on an ordinary Tuesday.

app = 'clubchat-worker'
primary_region = 'iad'

[build]
  dockerfile = '../Dockerfile'

# No release_command here. Migrations run exactly once per release, from fly/api.toml.
[deploy]
  strategy = 'rolling'

[processes]
  app = 'node packages/server/src/worker/main.ts'

[env]
  LOG_LEVEL = 'info'

  # --- Error reporting ---
  #
  # Byte-identical to fly/api.toml and fly/gateway.toml, for the reason those files give: one
  # Sentry project, three roles, each tagged by `initMonitoring`.
  #
  # On this role the DSN is not an improvement to reporting, it IS the reporting. The note under
  # the process definition below says a parked outbox event is "already captured to Sentry" and
  # is "the only signal there is" for a role with no health gate. That sentence is only true
  # where a DSN is set, and until 2026-08-23 none of these three files set one - so the single
  # named signal for the only role Fly cannot check did not exist.
  #
  # `monitoring.ts` gates every capture on SENTRY_DSN being defined and non-empty, and falls back
  # to the process logger otherwise. Here that fallback is a log line inside a machine with no
  # service, no health check and nothing tailing it. What a reader would see instead of an alert
  # is thumbnails silently never appearing and the outbox growing.
  SENTRY_DSN = 'https://f4737021a3d55097c56ff4c479b9cdaa@o4511847446609920.ingest.us.sentry.io/4511847456964608'
  SENTRY_ENVIRONMENT = 'production'

  # --- The six secrets, and THIS is the app where forgetting them is silent ---
  #
  # DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY and
  # MEDIA_SIGNING_SECRET are on the platform, not in this file, and **all six have to be set on
  # `clubchat-worker` as well as on `clubchat-api`.** One flat config schema, and every role
  # calls `loadConfig` on the whole of it at startup, so this process refuses to boot without a
  # signing secret it never reads and an auth secret it never uses.
  #
  # **The refusal is invisible.** This app declares no service (see the note below the process
  # definition), so there is no `/ready`, no health check and no deploy gate. A gateway missing a
  # secret fails its check and stalls the rolling deploy with a message; this one just does not
  # come up. Nothing fails, nothing pages, and what an operator would eventually notice is
  # thumbnails that never appear and an outbox that grows. It is the reason this comment exists
  # in all three files rather than only in fly/api.toml.
  #
  #   printf 'DATABASE_URL=%s\nREDIS_URL=%s\nBETTER_AUTH_SECRET=%s\n' \
  #          "$DB_URL" "$REDIS_URL" "$AUTH_SECRET" \
  #     | fly secrets import --app clubchat-worker
  #   printf 'S3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\n' "$S3_ID" "$S3_KEY" \
  #     | fly secrets import --app clubchat-worker
  #   printf 'MEDIA_SIGNING_SECRET=%s\n' "$(openssl rand -hex 24)" \
  #     | fly secrets import --app clubchat-worker
  #
  # `fly secrets import` and never `fly secrets set`: `set` takes the value as a command argument,
  # so it lands in shell history and in the process table. `import` reads NAME=VALUE from stdin.
  #
  # The S3 pair is the one this role reads for real, and a rotation that reaches only the api
  # leaves the media GC here authenticating with a revoked key - again with nothing to notice it.
  #
  # **MEDIA_SIGNING_SECRET here is a distinct throwaway, deliberately, and not a copy of the
  # api's.** Nothing in this role mints or verifies a media URL; the value exists only to clear
  # the schema's 16 character floor. So `fly secrets list` shows a different digest for this name
  # on each of the three apps, and that is correct rather than drift: the digest that has to
  # match is the api's against the CLOUDFLARE WORKER's, which `fly secrets list` cannot see.
  # fly/api.toml carries the whole argument and both halves of the command.
  #
  # --- Identity and object storage ---
  #
  # Required by the schema. This role reads the ENDPOINT and the credentials for real, and the
  # two bucket names not at all, which is worth stating because the opposite is the natural
  # assumption for the role that deletes objects.
  #
  # `main.ts` builds an `S3MediaStore` from S3_ENDPOINT, S3_REGION and the key pair, and the
  # media GC then deletes by the bucket recorded on each `media_objects` row (`mo.bucket`)
  # rather than by anything in this file. That is deliberate and it is why `media_objects`
  # carries a literal bucket name at all: an object has to be removable from wherever it was
  # actually put, including after these names change.
  #
  # So a wrong endpoint or a wrong credential here breaks the sweep, and a wrong bucket NAME
  # here does not. Both are still present because one flat schema serves all three roles.
  #
  # The stakes are higher on this role than on the other two, because `worker.toml` declares no
  # service and therefore has NO HEALTH GATE. A boot failure here fails no deploy and no check;
  # it surfaces later as an outbox that stopped draining. `fly/api.toml` carries the reasoning
  # for each value.
  BETTER_AUTH_URL = 'https://api.clubchatapp.com'
  CLIENT_ORIGIN = 'https://clubchatapp.com'
  S3_ENDPOINT = 'https://47a52f98315af67a4231d979935ab1f2.r2.cloudflarestorage.com'
  S3_BUCKET_PUBLIC = 'clubchat-identity'
  S3_BUCKET_PRIVATE = 'clubchat-content'

  # --- Media ---
  #
  # This is the role that actually touches the bytes: it derives thumbnails and display copies
  # for every uploaded photo, and the nightly GC removes objects. It reaches R2 through the S3
  # credentials, and it never mints a download URL for anybody, so it reads neither of these.
  # `urlMode` is consulted in exactly one place in the codebase, the api's media deps in
  # api/plumbing.ts, and MEDIA_CDN_BASE_URL only inside the `cdn` branch there.
  #
  # **Present because one flat config schema serves all three roles**, and every role parses
  # the whole of it at startup. Deleting either line stops this process booting, and the way it
  # fails is the worst of the three: the worker has no health gate at all (see the note below
  # the process definition), so a machine that will not start is not visible from outside. What
  # you would see instead is thumbnails silently never appearing and the outbox growing.
  #
  # Both values are kept identical to fly/api.toml deliberately, rather than being set to
  # something obviously inert here. A per-app value that drifts is how the two halves of a
  # signing scheme end up disagreeing, and the flip to `cdn` after the Worker is proved should
  # be one change made three times, not two changes and an exception. See fly/api.toml for what
  # they mean and why 'presign' ships first.
  MEDIA_URL_MODE = 'presign'
  MEDIA_CDN_BASE_URL = 'https://cdn.clubchatapp.com'

# No [http_service] and no [[services]] blocks, deliberately.
#
# The worker has no listening port, so there is nothing for Fly Proxy to route to and
# nothing for an HTTP check to ask. Declaring a service here would make Fly wait for a port
# that never opens and fail every deploy.
#
# The consequence, stated rather than left implicit: THIS ROLE HAS NO HEALTH GATE. A worker
# that boots, connects, and then silently stops draining looks identical to a healthy one
# from outside. The evidence that an effect never ran is a PARKED OUTBOX EVENT, which is
# durable and already captured to Sentry, so the alerting on parked events is not a nice to
# have for this role - it is the only signal there is.
#
# Exactly one machine. The drain claims rows with a lease and a per-partition gate, so a
# second machine is safe rather than harmful, but there is no reason to pay for one until
# outbox depth says so, and one machine keeps "did the effect run" a question with a single
# place to look.
#
# **Nothing in this file makes that true, and saying it here does not either.** Fly's config has
# no machine-count key: a count is set by the command, and `fly deploy` creates two machines by
# default. So "exactly one" is an operator step, and it is one of these:
#
#   fly deploy --ha=false --app clubchat-worker      # on the first deploy, before two exist
#   fly scale count 1 --app clubchat-worker          # afterwards, to get back to one
#   fly machines list --app clubchat-worker          # what is actually running, which is the
#                                                    # only answer that counts
#
# Worth checking rather than assuming, because two workers is the one wrong state this role
# cannot report: both drain correctly, the lease keeps them from doubling any effect, and the
# only evidence is a second machine on the bill. SPEC/TECH/21-deployment.md owns the deploy
# invocation and the intended count for each of the three roles.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']
