# Local development services only. Production is Neon Postgres plus Upstash Redis
# per SPEC/TECH/15-stack-and-hosting.md; nothing here is deployed.
#
# Postgres is pinned to 17 because the schema leans on behaviour that is version
# specific: partial unique indexes carrying the domain invariants, and NULL handling
# in unique indexes (SPEC/TECH/09-data-model.md - a nullable column silently defeats
# a unique constraint, which is why sender_id and client_msg_id are NOT NULL).

services:
  postgres:
    image: postgres:17-alpine
    container_name: clubchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubchat
      POSTGRES_PASSWORD: clubchat
      POSTGRES_DB: clubchat
      # Deterministic collation so ORDER BY and unique comparisons do not shift
      # between a developer machine and CI.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # pg_stat_statements, which answers the question the per-request query counter
    # cannot: not "what did THIS request cost" but "what is this database spending
    # its life on", across the api, the worker and the gateway at once, with no
    # application instrumentation at all. It has to be preloaded at startup, so it
    # is a server flag rather than anything a migration could do.
    #
    # `track=all` counts statements inside functions too, and `track_utility=off`
    # keeps the DDL the migrations run out of the top of the report - they run once
    # and are never the thing being looked for.
    #
    # `CREATE EXTENSION` is still needed per database and is deliberately NOT a
    # migration: it wants rights the application role should not be assumed to have,
    # and a migration that can fail on a managed provider is a worse trade than a
    # command somebody runs once. `npm run db:stats` does it, idempotently.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.track_utility=off"
    ports:
      - "5432:5432"
    volumes:
      - clubchat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubchat -d clubchat"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    container_name: clubchat-redis
    restart: unless-stopped
    # Redis is a cache and a bus, never a source of truth
    # (SPEC/TECH/00-overview.md). No persistence is configured on purpose: if
    # flushing Redis were to corrupt anything rather than merely degrade realtime,
    # that is a design defect and this container is where it should show up first.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for development.
  #
  # Production is Cloudflare R2, chosen for zero egress because media egress is the
  # dominant variable cost. MinIO stands in locally because it speaks the same API,
  # which matters more than it might sound: the presigned-PUT flow and the HEAD
  # verification at /media/:id/complete are exactly the parts that would pass against
  # a hand-written fake and fail against a real bucket. A fake is used in unit tests;
  # this is what the integration path runs against.
  minio:
    image: minio/minio:latest
    container_name: clubchat-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: clubchat
      MINIO_ROOT_PASSWORD: clubchat-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - clubchat-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  clubchat-pgdata:
  clubchat-minio:
